name: pre-commit

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: 3.x
    # The local hooks call make, which calls Emacs.  The same Emacs the
    # test matrix ends on, not whichever one the runner image ships: the
    # two answered differently about one doc string, and a check that
    # disagrees with the checks beside it is worth nothing.
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5   # v8.0
      with:
        version: '30.2'
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd   # v3.0.1
